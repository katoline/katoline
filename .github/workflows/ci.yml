name: CI
# action はタグではなくコミット SHA で固定する（タグの付け替えによる差し替えを防ぐ。更新は Dependabot）

on:
  pull_request:
  push:
    branches: [main]

# 読み取り権限のみ（デプロイは Vercel 側で行う）
permissions:
  contents: read

# 同じブランチの古い実行はキャンセルして無駄な実行を減らす
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js を準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # リポジトリの設定で GitHub 公式の Action しか使えないため、pnpm/action-setup ではなく npm で入れる
      - name: pnpm を準備
        run: |
          npm install -g pnpm@11.22.0
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: pnpm のストアをキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: 依存関係をインストール（lock ファイルから厳密に）
        run: pnpm install --frozen-lockfile

      - name: Biome（lint・フォーマット・import 整列）
        run: pnpm lint

      - name: 型チェック
        run: pnpm check

      - name: ビルド
        run: pnpm build

      - name: 内部リンク検査
        run: pnpm check:links

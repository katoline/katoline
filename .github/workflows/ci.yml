name: CI

on:
  pull_request:
  push:
    branches: [main]

# 読み取り権限のみ（デプロイは Vercel 側で行う）
permissions:
  contents: read

# 同じブランチの古い実行はキャンセルして無駄な実行を減らす
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: pnpm を準備
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Node.js を準備
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 依存関係をインストール（lock ファイルから厳密に）
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm check

      - name: ビルド
        run: pnpm build

      - name: 内部リンク検査
        run: pnpm check:links
